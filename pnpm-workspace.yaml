# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

# Use minimumReleaseAgeExclude temporarily for emergency security vulnerability fixes
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.13
  - browserslist@4.28.8
  - caniuse-lite@1.0.30001809
  - electron-to-chromium@1.5.403
  - nanoid@3.3.18
  - node-releases@2.0.53
  - update-browserslist-db@1.3.0

# Don't warn about ignored build scripts
ignoredBuiltDependencies: []

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

overrides:
  "@typescript-eslint/typescript-estree>minimatch": ">=9.0.7"
  "editorconfig>minimatch": ">=9.0.7"
  "hds-react>cookie": "0.7.2"
  "lodash": ">=4.18.1"
  "uuid": ">=11.1.1"
  "js-yaml@^4": "^4.3.1"
  "ws@^8": "^8.21.0"
  "brace-expansion": ">=5.0.9"
  "shell-quote": ">=1.8.4"
  "tmp": ">=0.2.6"
  "fast-uri": ">=3.1.5"
  "postcss": ">=8.5.18"
  "sass>immutable": ">=4.3.9 <5"
  "@ardatan/relay-compiler>immutable": ">=5.1.8"

# Allow plugins that lag on peer ranges to load under ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint: "10"

allowBuilds:
  "@ffmpeg-installer/darwin-arm64": true
  "@ffmpeg-installer/darwin-x64": true
  "@ffmpeg-installer/linux-x64": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true
